name: TRACK audio-to-score Python validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-transcription:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install minimal audio and MusicXML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.24,<2.0' 'scipy>=1.11' 'librosa>=0.10.2' 'soundfile>=0.12.1' 'music21>=9.1' 'httpx>=0.27' 'pydantic>=2.7'
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: Audio to MusicXML real test
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_local_audio_pipeline -v
      - name: Vocal lyrics MusicXML and silence regression
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_vocal_score -v
