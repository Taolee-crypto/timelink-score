[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timelink-score"
version = "0.1.0"
description = "TL3 음원 → 오선지 악보 자동 생성 (TimeLink 확장 모듈)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
    { name = "Taolee-crypto" },
]
license = { text = "Proprietary" }
keywords = ["timelink", "tl3", "music", "score", "transcription"]

dependencies = [
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.24,<2.0",
    "scipy>=1.11",
    "demucs>=4.0.1",
    "basic-pitch>=0.4.0",
    "music21>=9.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
vocal-inference = ["torchcrepe>=0.0.23", "whisperx>=3.3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
tlscore = "timelink_score.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
